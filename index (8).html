<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UT Market</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbeff2;--surface:#fffdfb;--ink:#3a1f2b;--muted:#7d6670;--line:#ecd5dc;--pink:#d6336c;--pink-t:#fde3ec;--ok:#06a84a;--ok-t:#dcf3e5;--err:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1217;--surface:#2a1b22;--ink:#f6e8ed;--muted:#b799a4;--line:#4a3039;--pink:#ff7aa5;--pink-t:#43202f;--ok:#43d27d;--ok-t:#16382a;--err:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1217;--surface:#2a1b22;--ink:#f6e8ed;--muted:#b799a4;--line:#4a3039;--pink:#ff7aa5;--pink-t:#43202f;--ok:#43d27d;--ok-t:#16382a;--err:#ff8a7a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans Thai",system-ui,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.wrap{max-width:480px;margin:auto;background:var(--surface);min-height:100vh;min-height:100dvh}
.hero{width:100%;height:150px;object-fit:cover;display:block}
.in{padding:16px}
h1{margin:0;font-size:1.4rem}.sub{margin:2px 0 8px;color:var(--muted);font-size:.9rem}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ph{width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--pink-t);display:grid;place-items:center;font-size:1.6rem;flex:none}
.item .t{flex:1}.item .t span{display:block;color:var(--muted);font-size:.85rem}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-weight:700}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.cta{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--ok);color:#fff;font-weight:700}
.cta:disabled{opacity:.45;cursor:not-allowed}
.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.note{color:var(--muted);font-size:.85rem}.err{color:var(--err);font-size:.9rem;margin:8px 0 0}
.ticket{border:2px dashed var(--pink);border-radius:14px;padding:14px;text-align:center;margin:12px 0}
.ticket b{display:block;font-size:2.8rem;line-height:1.1;color:var(--pink)}
.sum{background:var(--bg);border-radius:12px;padding:12px;font-size:.95rem}
.sum div{display:flex;justify-content:space-between;gap:8px}
.queue{margin:0 0 6px;padding:6px 12px;border-radius:10px;background:var(--ok-t);color:var(--ok);font-size:.9rem;font-weight:500}.queue.full{background:var(--pink-t);color:var(--err)}
.demo{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
.demo pre{margin:6px 0 0;background:var(--bg);padding:10px 12px;border-radius:10px;font:inherit;font-size:.85rem;white-space:pre-wrap}

.back{display:inline-block;margin:12px 16px 0;color:var(--muted);font-size:.9rem;text-decoration:none}
.shop{display:flex;gap:12px;align-items:center;padding:10px;margin-bottom:12px;border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none;background:var(--surface)}
.shop img{width:84px;height:84px;border-radius:10px;object-fit:cover;flex:none}
.shop b{display:block;font-size:1.05rem}.shop span{display:block;color:var(--muted);font-size:.85rem}
.shop .go{margin-top:4px;color:var(--ok);font-weight:700}
.shop.soon{border-style:dashed;background:transparent;color:var(--muted)}
.shop.soon .ph{width:84px;height:84px;font-size:2rem;background:var(--bg)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{border:1px solid var(--line);padding:0 6px;white-space:nowrap}th{background:var(--bg);text-align:left;padding:6px}
.cell{width:100%;min-width:80px;border:0;background:transparent;padding:8px 4px}.cell:focus{background:var(--pink-t);outline:0}
.bar2{display:flex;gap:8px;margin:8px 0;align-items:center}input[type=date],input[type=password]{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
</style></head><body>

{name:"ร้านใหม่",soon:1},{name:"ร้านใหม่",soon:1},{name:"ร้านใหม่",soon:1}];
let cart={},name="",note="",busy=false,err="",done=null,srv={n:0},D={};
try{D=JSON.parse(localStorage.getItem("shops-demo")||"{}")}catch(e){}
const dd=id=>D[id]||(D[id]={seq:0,act:[]});
const saveD=()=>{try{localStorage.setItem("shops-demo",JSON.stringify(D))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shop=()=>SHOPS.find(s=>s.id&&!s.soon&&s.id===location.hash.slice(1));
const thumb=m=>m.i?`<img class="ph" src="${IMG[m.i]}" alt="${m.n}">`:`<span class="ph" aria-hidden="true">${m.e}</span>`;
const cnt=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const tot=s=>s.menu.reduce((t,m,i)=>t+(cart[i]||0)*m.p,0);
const items=s=>s.menu.map((m,i)=>cart[i]?{n:m.n,qty:cart[i],p:m.p}:null).filter(Boolean);
const used=s=>ENDPOINT?srv.n:dd(s.id).act.length;
const full=s=>used(s)>=MAX;
const msgText=(q,o)=>"ออเดอร์ใหม่ "+q+"\nชื่อ: "+o.name+"\n"+o.items.map(x=>"• "+x.n+" ×"+x.qty).join("\n")+(o.note?"\nหมายเหตุ: "+o.note:"")+"\nรวม "+o.total+" บาท";
function home(){
document.title="UT Market";
return `<div class="in"><h1>UT Market</h1><p class="sub">เลือกร้านที่จะสั่ง กดที่ร้านเพื่อดูเมนูและสั่งอาหาร</p>`+SHOPS.map(s=>s.soon
?`<div class="shop soon"><span class="ph" aria-hidden="true">🏪</span><div><b>${s.name}</b><span>เร็ว ๆ นี้</span></div></div>`
:`<a class="shop" href="#${s.id}"><img src="${s.img}" alt="หน้าร้าน${s.name}"><div><b>${s.name}</b><span>${s.tag}</span><span class="go">ดูเมนูและสั่งอาหาร</span></div></a>`).join("")+`<p class="note"><a href="#admin">สำหรับร้านค้า</a></p></div>`}
function view(){
const a=document.getElementById("app"),s=shop();
document.querySelector(".wrap").style.maxWidth=location.hash==="#admin"?"1100px":"";
if(location.hash==="#admin"){admin();return}
if(!s){a.innerHTML=home();return}
document.title=s.name+" · UT Market";
const back=`<a class="back" href="#">← ร้านทั้งหมด</a>`;
if(done){a.innerHTML=back+`<div class="in"><h1>ส่งออเดอร์แล้ว</h1><p class="sub">${s.name} ได้รับออเดอร์ของคุณแล้ว รอเรียกชื่อที่หน้าร้าน</p>
<div class="ticket">เลขคิวของคุณ<b>${done.q}</b>${esc(done.name)}</div><p class="queue" role="status">${STX[done.st]}</p>
<div class="sum">${done.items.map(x=>`<div><span>${esc(x.n)} ×${x.qty}</span><span>${x.p*x.qty}</span></div>`).join("")}<div><b>รวม</b><b>${done.total} บาท</b></div></div>
<p class="note">จ่ายเงินด้วย QR ที่หน้าร้านตอนรับของ</p>
${ENDPOINT?"":`<div class="demo"><span class="note">โหมดตัวอย่าง: นี่คือข้อความที่ร้านจะได้รับในไลน์</span><pre>${esc(msgText(done.q,done))}</pre></div>`}
${!ENDPOINT&&done.st==="waiting"?`<button class="cta sec" id="acc">(ตัวอย่าง) ผู้ขายกดรับออเดอร์ในไลน์</button>`:""}<button class="cta sec" id="again">สั่งเพิ่ม</button></div>`;
document.getElementById("again").onclick=()=>{done=null;view()};const ac=document.getElementById("acc");if(ac)ac.onclick=()=>{done.st="accepted";const r=LO.find(x=>x.id===done.lid);if(r)r.status="accepted";saveLO();view()};return}
a.innerHTML=`<img class="hero" src="${s.img}" alt="หน้าร้าน${s.name}">`+back+`<div class="in"><h1>${s.name}</h1><p class="sub">เลือกเมนู แล้วกดส่งออเดอร์ให้ร้านได้เลย</p><p class="queue${full(s)?" full":""}" role="status">คิวตอนนี้ ${used(s)}/${MAX}${full(s)?" · คิวเต็มแล้ว กรุณารอสักครู่แล้วลองใหม่":""}</p>`
+s.menu.map((m,i)=>`<div class="item">${thumb(m)}<div class="t">${m.n}<span>${m.p} บาท</span></div><div class="qty"><button data-d="${i}" aria-label="ลด ${m.n}">−</button><b>${cart[i]||0}</b><button data-i="${i}" aria-label="เพิ่ม ${m.n}">+</button></div></div>`).join("")
+`<label for="nm">ชื่อสำหรับเรียกคิว</label><input type="text" id="nm" maxlength="30" placeholder="เช่น พี่แอน" value="${esc(name)}">
<label for="nt">หมายเหตุ</label><input type="text" id="nt" maxlength="80" placeholder="เช่น ไม่ใส่ผัก" value="${esc(note)}">
${err?`<p class="err" role="alert">${esc(err)}</p>`:""}
<button class="cta" id="send" ${cnt()&&!busy&&!full(s)?"":"disabled"}>${busy?"กำลังส่ง…":full(s)?"คิวเต็มแล้ว":"ส่งออเดอร์"+(cnt()?" ("+tot(s)+" บาท)":"")}</button>${!ENDPOINT&&dd(s.id).act.length?`<button class="cta sec" id="free">(ตัวอย่าง) ร้านทำเสร็จ 1 คิว</button>`:""}</div>`;
document.getElementById("nm").oninput=e=>name=e.target.value;
document.getElementById("nt").oninput=e=>note=e.target.value;
document.getElementById("send").onclick=send;
const f=document.getElementById("free");if(f)f.onclick=()=>{dd(s.id).act.shift();saveD();view()}}
async function send(){
const s=shop(),o={shop:s.id,name:name.trim()||"ลูกค้า",note:note.trim(),items:items(s),total:tot(s)};
busy=true;err="";view();
try{let q,tk,lid;
if(ENDPOINT){const r=await fetch(ENDPOINT+"/order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)});if(r.status===409){srv=await r.json();throw "full"}if(!r.ok)throw 0;const j=await r.json();q=j.q;tk=j.t;srv.n=j.n}
else{const d=dd(s.id);if(d.act.length>=MAX)throw "full";d.seq++;q="Q"+String(d.seq).padStart(2,"0");d.act.push(q);saveD();lid=Date.now();LO.push({id:lid,day:bkk(),shop_id:s.id,created_at:new Date().toISOString(),q,customer:o.name,note:o.note,items_text:o.items.map(x=>x.n+" ×"+x.qty).join(", "),total:o.total,status:"waiting"});saveLO()}
done={...o,q,token:tk,lid,st:"waiting"};cart={};note=""}
catch(e){err=e==="full"?"ตอนนี้คิวเต็มแล้ว ("+MAX+"/"+MAX+") กรุณารอสักครู่แล้วกดส่งใหม่":"ส่งออเดอร์ไม่สำเร็จ กรุณาลองกดส่งอีกครั้ง หรือแจ้งที่หน้าร้าน"}
busy=false;view()}
const ST={waiting:"รอรับ",accepted:"กำลังทำ",done:"เสร็จแล้ว",cancelled:"ยกเลิก"};
const STX={waiting:"รอร้านรับออเดอร์",accepted:"ร้านรับออเดอร์แล้ว กำลังทำให้",done:"ออเดอร์พร้อมแล้ว มารับได้เลย",cancelled:"ร้านยกเลิกออเดอร์ กรุณาติดต่อที่ร้าน"};
const bkk=()=>new Date(Date.now()+7*36e5).toISOString().slice(0,10);
let LO=[];try{LO=JSON.parse(localStorage.getItem("shops-lo")||"[]")}catch(e){}
const saveLO=()=>{try{localStorage.setItem("shops-lo",JSON.stringify(LO))}catch(e){}};
let pin="",rows=[],day=bkk(),aerr="";
const tm=r=>new Date(r.created_at).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
const api=(p,o={})=>fetch(ENDPOINT+p,{...o,headers:{"Content-Type":"application/json","x-pin":pin}}).then(async r=>{if(!r.ok){let m="";try{m=(await r.json()).error||""}catch(x){}throw{s:r.status,m}}return r.json()});
async function load(){aerr="";try{rows=ENDPOINT?await api("/admin/orders?date="+day):LO.filter(r=>r.day===day)}catch(e){const c=e&&e.s;aerr=c===401?"รหัสผ่านไม่ถูกต้อง":"โหลดไม่สำเร็จ"+(e&&e.m?": "+e.m:"");rows=[];if(c===401)pin=""}admin()}
function exp(){const d=rows.map(r=>({"เวลา":tm(r),"ร้าน":r.shop_id,"คิว":r.q,"ชื่อ":r.customer,"รายการ":r.items_text,"หมายเหตุ":r.note,"รวม":r.total,"สถานะ":ST[r.status]}));
if(window.XLSX){const w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(d),"ออเดอร์");XLSX.writeFile(w,"orders-"+day+".xlsx")}
else{const c="\ufeff"+Object.keys(d[0]||{}).join(",")+"\n"+d.map(x=>Object.values(x).map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));l.download="orders-"+day+".csv";l.click()}}
function admin(){const a=document.getElementById("app"),back=`<a class="back" href="#">← กลับ</a>`;
document.title="จัดการออเดอร์ · UT Market";
if(ENDPOINT&&!pin){a.innerHTML=back+`<div class="in"><h1>จัดการออเดอร์</h1><label for="pn">รหัสผ่านร้าน</label><input type="password" id="pn" autocomplete="off">${aerr?`<p class="err" role="alert">${aerr}</p>`:""}</div>`;return}
const sum=rows.filter(r=>r.status!=="cancelled").reduce((t,r)=>t+(Number(r.total)||0),0);
a.innerHTML=back+`<div class="in"><h1>ออเดอร์ทั้งหมด</h1><div class="bar2"><input type="date" id="dy" value="${day}"><button class="act" id="ex">ส่งออก Excel</button></div>${aerr?`<p class="err" role="alert">${aerr}</p>`:""}
<div class="tw"><table><thead><tr><th>เวลา</th><th>ร้าน</th><th>คิว</th><th>ชื่อ</th><th>รายการ</th><th>หมายเหตุ</th><th>รวม (บาท)</th><th>สถานะ</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr data-id="${r.id}"><td>${tm(r)}</td><td>${esc(r.shop_id)}</td><td>${esc(r.q)}</td>${["customer","items_text","note","total"].map(f=>`<td><input class="cell" data-f="${f}" value="${esc(r[f]??"")}"></td>`).join("")}<td><select class="cell" data-f="status">${Object.keys(ST).map(k=>`<option value="${k}"${r.status===k?" selected":""}>${ST[k]}</option>`).join("")}</select></td></tr>`).join(""):`<tr><td colspan="8" class="note">ยังไม่มีออเดอร์ในวันนี้</td></tr>`}</tbody></table></div>
<p class="note">แก้ในช่องแล้วบันทึกอัตโนมัติ · ยอดรวม ${sum} บาท (ไม่นับที่ยกเลิก) · ${rows.length} ออเดอร์</p></div>`;
document.getElementById("ex").onclick=exp}
document.addEventListener("change",async e=>{const t=e.target;
if(t.id==="dy"){day=t.value;load();return}
if(t.id==="pn"){pin=t.value;load();return}
if(!t.classList.contains("cell"))return;
const id=t.closest("tr").dataset.id,f=t.dataset.f,v=f==="total"?Number(t.value)||0:t.value;
try{if(ENDPOINT)await api("/admin/update",{method:"POST",body:JSON.stringify({id,f,v})});else{Object.assign(LO.find(r=>String(r.id)===id),{[f]:v});saveLO()}
Object.assign(rows.find(r=>String(r.id)===id)||{},{[f]:v});t.style.outline="2px solid var(--ok)"}catch(x){t.style.outline="2px solid var(--err)"}});
async function refresh(){
if(location.hash==="#admin"){if((pin||!ENDPOINT)&&!/INPUT|SELECT/.test(document.activeElement?.tagName||""))await load();else if(!pin)view();return}
if(ENDPOINT&&done&&done.token){try{done.st=(await(await fetch(ENDPOINT+"/track?t="+done.token)).json()).status}catch(e){}}
if(ENDPOINT&&shop()){try{srv=await(await fetch(ENDPOINT+"/status?shop="+shop().id)).json()}catch(e){}}if(!document.activeElement||!/INPUT/.test(document.activeElement.tagName))view()}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
if(b.dataset.i!==undefined)cart[b.dataset.i]=(cart[b.dataset.i]||0)+1;
else if(b.dataset.d!==undefined)cart[b.dataset.d]=Math.max(0,(cart[b.dataset.d]||0)-1);else return;view()});
window.addEventListener("hashchange",()=>{cart={};done=null;err="";location.hash==="#admin"?load():view();window.scrollTo(0,0)});
refresh();if(ENDPOINT)setInterval(refresh,8000);
</script></body></html>
